<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#285438" />
    <title>Flockbook — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font:
          18px system-ui,
          sans-serif;
        background: #f7f8f2;
        color: #193624;
      }
      main {
        max-width: 30rem;
        padding: max(24px, env(safe-area-inset-top)) 24px;
        text-align: center;
      }
      img {
        width: 96px;
        border-radius: 24px;
      }
      p {
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 14px 24px;
        background: #285438;
        color: white;
        border-radius: 12px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>
        Flockbook needs an internet connection to load and save farm records. Reconnect, then try
        again. Changes that were not saved before the connection dropped may need to be entered
        again.
      </p>
      <a href="/dashboard">Try again</a>
    </main>
  </body>
</html>
